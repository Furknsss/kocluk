<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Furkan | İTÜ Elektrik İlk 5.000 Koçluk Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; }
    .task-card { transition: all 0.2s ease; }
    .task-card.done { opacity: 0.6; border-color: #10b981 !important; background-color: rgba(16, 185, 129, 0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Üst Başlık & Durum -->
    <header class="bg-slate-800/90 border border-slate-700 rounded-2xl p-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4 shadow-lg">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-1 text-xs font-bold uppercase tracking-wider bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-full">19 - 25 Ekim Kampı</span>
          <span id="syncBadge" class="px-2.5 py-1 text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">● E-Tablo Senkron Aktif</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold mt-2 tracking-tight">Furkan — İTÜ Elektrik (İlk 5.000)</h1>
        <p class="text-slate-400 text-sm mt-1">Günlük 9 Saat: 2s AYT Trigo + 1s Geometri + 6s Akıllı Dengeli TYT Fen</p>
      </div>

      <div class="flex flex-col items-end gap-2">
        <div class="text-right">
          <span class="text-xs text-slate-400 block">Haftalık İlerleme</span>
          <span id="progressText" class="text-2xl font-black text-emerald-400">0 / 35 (%0)</span>
        </div>
        <button onclick="pushAllToSheet()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-600 transition">
          🔄 Tabloyu Şimdi Eşitle
        </button>
      </div>
    </header>

    <!-- İlerleme Çubuğu -->
    <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden border border-slate-700">
      <div id="progressBar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
    </div>

    <!-- Gün Seçici Sekmeler -->
    <div id="dayTabs" class="flex flex-wrap gap-2"></div>

    <!-- Seçili Günün Görev Listesi -->
    <div id="tasksContainer" class="space-y-3"></div>

    <!-- Sabit Hatırlatmalar -->
    <footer class="bg-slate-800/60 border border-slate-700/70 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-center text-xs text-slate-400 gap-2">
      <div>⏰ <strong>Her Akşam 22:30:</strong> Kronometre & Görev Fotoğraf Raporu</div>
      <div>📅 <strong>Pazar 21:00:</strong> Haftalık Ana Değerlendirme Toplantısı</div>
    </footer>
  </div>

  <script>
    // Google Apps Script Web App URL'nizi buraya yapıştırın (Mevcut URL varsa koruyun)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydDvO1JOiiwDWzi_HSC0wsehMzioy02OTH1srpXMkv8agnBWn9MtxBqrDUn9MT8q_uYw/exec";

    const INITIAL_TASKS = [
      // 19 EKİM PAZARTESİ (9 Saat)
      { id: "pzt-1", day: "19 Ekim Pazartesi", title: "Trigonometri 1-5. Bölüm (Tüm Videolar + Ödev Testi 1, 2, Birim Çember Özel, 3, 4, 5)", source: "📖 345 Allstar AYT Mat", duration: "⏱️ 2 Saat", done: false },
      { id: "pzt-2", day: "19 Ekim Pazartesi", title: "Üçgenler Soru Çözümü", source: "📖 345 GGÇK / Eyüp B. SB", duration: "⏱️ 1 Saat", done: false },
      { id: "pzt-3", day: "19 Ekim Pazartesi", title: "Fizik Bilimine Giriş (1-2. Ders + 3 Test) & Madde ve Özellikleri (1-4. Ders + 6 Test)", source: "📖 345 Allstar TYT Fizik", duration: "⏱️ 2 Saat", done: false },
      { id: "pzt-4", day: "19 Ekim Pazartesi", title: "Kimya Bilimi (1-5. Ders + 6 Test) & Atom ve Periyodik Sistem (1-2. Ders)", source: "📖 345 Allstar TYT Kimya", duration: "⏱️ 2 Saat", done: false },
      { id: "pzt-5", day: "19 Ekim Pazartesi", title: "Yaşam Bilimi Biyoloji (1-6. Ders + ÖSYM 1-2) & Canlı Yapısındaki Bileşikler (1-5. Ders)", source: "📖 345 Allstar TYT Biyoloji", duration: "⏱️ 2 Saat", done: false },

      // 20 EKİM SALI (9 Saat)
      { id: "sal-1", day: "20 Ekim Salı", title: "Trigonometri 6-10. Bölüm (Tüm Videolar + Ödev Testi 6A-B, 7A-B, 8, 9, 10)", source: "📖 345 Allstar AYT Mat", duration: "⏱️ 2 Saat", done: false },
      { id: "sal-2", day: "20 Ekim Salı", title: "Üçgenler Soru Çözümü", source: "📖 345 GGÇK / Eyüp B. SB", duration: "⏱️ 1 Saat", done: false },
      { id: "sal-3", day: "20 Ekim Salı", title: "Hareket (1-3. Ders + Karma 1-4 & Günlük Hayat 1-2 - 6 Test)", source: "📖 345 Allstar TYT Fizik", duration: "⏱️ 1.5 Saat", done: false },
      { id: "sal-4", day: "20 Ekim Salı", title: "Atom ve Periyodik Sistem Bitiş (3-5. Ders + Karma 1-3 & ÖSYM 1-3 - 6 Test)", source: "📖 345 Allstar TYT Kimya", duration: "⏱️ 1.5 Saat", done: false },
      { id: "sal-5", day: "20 Ekim Salı", title: "Canlı Yapısındaki Bileşikler Bitiş (6-19. Dersler + 8 ÖSYM Testi Tamamı)", source: "📖 345 Allstar TYT Biyoloji", duration: "⏱️ 3 Saat", done: false },

      // 21 EKİM ÇARŞAMBA (9 Saat)
      { id: "car-1", day: "21 Ekim Çarşamba", title: "Trigonometri 11-16. Bölüm (Tüm Videolar + Ödev Testi 11, 12, 13, 14A-B, 15A-B, 16A-B)", source: "📖 345 Allstar AYT Mat", duration: "⏱️ 2 Saat", done: false },
      { id: "car-2", day: "21 Ekim Çarşamba", title: "Üçgenler Soru Çözümü", source: "📖 345 GGÇK / Eyüp B. SB", duration: "⏱️ 1 Saat", done: false },
      { id: "car-3", day: "21 Ekim Çarşamba", title: "Kuvvet (1-4. Ders + Karma 1-4 & Günlük Hayat 1-2 - 6 Test)", source: "📖 345 Allstar TYT Fizik", duration: "⏱️ 1.5 Saat", done: false },
      { id: "car-4", day: "21 Ekim Çarşamba", title: "Kimyasal Türler Arası Etkileşimler - 1 (1-5. Dersler + Karma 1-2)", source: "📖 345 Allstar TYT Kimya", duration: "⏱️ 1.5 Saat", done: false },
      { id: "car-5", day: "21 Ekim Çarşamba", title: "Hücre Tamamı (1-15. Dersler + 6 ÖSYM Testi)", source: "📖 345 Allstar TYT Biyoloji", duration: "⏱️ 3 Saat", done: false },

      // 22 EKİM PERŞEMBE (9 Saat)
      { id: "per-1", day: "22 Ekim Perşembe", title: "Trigonometri 17-21. Bölüm (Teoremler, Grafik, Ters Trigo + Ödev Testi 17A-B, 18A-B, 19A-C, 20, 21)", source: "📖 345 Allstar AYT Mat", duration: "⏱️ 2 Saat", done: false },
      { id: "per-2", day: "22 Ekim Perşembe", title: "Üçgenler Soru Çözümü", source: "📖 345 GGÇK / Eyüp B. SB", duration: "⏱️ 1 Saat", done: false },
      { id: "per-3", day: "22 Ekim Perşembe", title: "İş-Güç-Enerji (1-2. Ders + 6 Test) & Isı ve Sıcaklık (1-4. Ders + 6 Test)", source: "📖 345 Allstar TYT Fizik", duration: "⏱️ 2.5 Saat", done: false },
      { id: "per-4", day: "22 Ekim Perşembe", title: "Türler Arası Etkileşim Bitiş (6-7. Ders + 4 Test) & Maddenin Halleri (1-5. Ders + 6 Test)", source: "📖 345 Allstar TYT Kimya", duration: "⏱️ 2 Saat", done: false },
      { id: "per-5", day: "22 Ekim Perşembe", title: "Sınıflandırma (1-2. Ders + ÖSYM 1) & Canlı Âlemleri Başlangıç (1-5. Ders)", source: "📖 345 Allstar TYT Biyoloji", duration: "⏱️ 1.5 Saat", done: false },

      // 23 EKİM CUMA (9 Saat)
      { id: "cum-1", day: "23 Ekim Cuma", title: "Trigonometri 22-26. Bölüm (Toparlayalım 1, Toplam-Fark, Yarım Açı + Testler 23A-B, 24A-B, 25A-C, 26A-B)", source: "📖 345 Allstar AYT Mat", duration: "⏱️ 2 Saat", done: false },
      { id: "cum-2", day: "23 Ekim Cuma", title: "Üçgenler Soru Çözümü", source: "📖 345 GGÇK / Eyüp B. SB", duration: "⏱️ 1 Saat", done: false },
      { id: "cum-3", day: "23 Ekim Cuma", title: "Elektrostatik (1-2. Ders + 4 Test), Elektrik (6 Test) & Manyetizma (1. Ders + 3 Test)", source: "📖 345 Allstar TYT Fizik", duration: "⏱️ 2 Saat", done: false },
      { id: "cum-4", day: "23 Ekim Cuma", title: "Doğa ve Kimya (1-2. Ders + 3 Test) & Kimyasal Hesaplamalar (1-7. Ders + 5 Test)", source: "📖 345 Allstar TYT Kimya", duration: "⏱️ 2.5 Saat", done: false },
      { id: "cum-5", day: "23 Ekim Cuma", title: "Canlı Âlemleri Bitiş (6-10. Ders + 6 ÖSYM Testi Tamamı)", source: "📖 345 Allstar TYT Biyoloji", duration: "⏱️ 1.5 Saat", done: false },

      // 24 EKİM CUMARTESİ (9 Saat)
      { id: "cmt-1", day: "24 Ekim Cumartesi", title: "Trigonometri 27-35. Bölüm (Yarım Açı Soru, Denklemler, Toparlayalım 2 + Testler 27A-B, 28-34)", source: "📖 345 Allstar AYT Mat", duration: "⏱️ 2 Saat", done: false },
      { id: "cmt-2", day: "24 Ekim Cumartesi", title: "Üçgenler Soru Çözümü", source: "📖 345 GGÇK / Eyüp B. SB", duration: "⏱️ 1 Saat", done: false },
      { id: "cmt-3", day: "24 Ekim Cumartesi", title: "Basınç (1-3. Ders + 6 Test), Kaldırma Kuv. (1-2. Ders + 3 Test) & Dalgalar (5 Ders + 11 Test)", source: "📖 345 Allstar TYT Fizik", duration: "⏱️ 2.5 Saat", done: false },
      { id: "cmt-4", day: "24 Ekim Cumartesi", title: "Karışımlar (1-6. Ders + Karma 1-3 & ÖSYM 1-2 - 5 Test)", source: "📖 345 Allstar TYT Kimya", duration: "⏱️ 1.5 Saat", done: false },
      { id: "cmt-5", day: "24 Ekim Cumartesi", title: "Hücre Bölünmeleri ve Üreme (1-7. Ders + 6 ÖSYM Testi)", source: "📖 345 Allstar TYT Biyoloji", duration: "⏱️ 2 Saat", done: false },

      // 25 EKİM PAZAR (9 Saat)
      { id: "paz-1", day: "25 Ekim Pazar", title: "Trigonometri Mühürleme: ÖSYM Testleri (1-10) + Seçici Sorular Testi", source: "📖 345 Allstar AYT Mat", duration: "⏱️ 2 Saat", done: false },
      { id: "paz-2", day: "25 Ekim Pazar", title: "Üçgenler Soru Çözümü", source: "📖 345 GGÇK / Eyüp B. SB", duration: "⏱️ 1 Saat", done: false },
      { id: "paz-3", day: "25 Ekim Pazar", title: "Optik Tamamı: Aydınlanma, Düzlem/Küresel Ayna, Kırılma, Mercekler (13 Ders + 21 Test)", source: "📖 345 Allstar TYT Fizik", duration: "⏱️ 3 Saat", done: false },
      { id: "paz-4", day: "25 Ekim Pazar", title: "Asit-Baz-Tuz (1-4. Ders + 5 Test) & Kimya Her Yerde (1-4. Ders + 2 Test)", source: "📖 345 Allstar TYT Kimya", duration: "⏱️ 1.5 Saat", done: false },
      { id: "paz-5", day: "25 Ekim Pazar", title: "Ekosistem Ekolojisi ve Güncel Çevre Sorunları (1-10. Ders + 5 ÖSYM Testi)", source: "📖 345 Allstar TYT Biyoloji", duration: "⏱️ 1.5 Saat", done: false }
    ];

    const STORAGE_KEY = "FURKAN_19_25_EKIM_V1";
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || INITIAL_TASKS;
    const days = [...new Set(INITIAL_TASKS.map(t => t.day))];
    let activeDay = days[0];

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function renderTabs() {
      const container = document.getElementById("dayTabs");
      container.innerHTML = "";
      days.forEach(day => {
        const dayTasks = tasks.filter(t => t.day === day);
        const doneCount = dayTasks.filter(t => t.done).length;
        const isActive = day === activeDay;

        const btn = document.createElement("button");
        btn.className = `px-4 py-2 rounded-xl text-xs md:text-sm font-bold border transition ${
          isActive
            ? "bg-blue-600 text-white border-blue-500 shadow-md"
            : "bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700"
        }`;
        btn.innerHTML = `${day} <span class="ml-1 opacity-75">(${doneCount}/${dayTasks.length})</span>`;
        btn.onclick = () => { activeDay = day; render(); };
        container.appendChild(btn);
      });
    }

    function renderTasks() {
      const container = document.getElementById("tasksContainer");
      container.innerHTML = "";
      const dayTasks = tasks.filter(t => t.day === activeDay);

      dayTasks.forEach(task => {
        const card = document.createElement("div");
        card.className = `task-card bg-slate-800/90 border border-slate-700 rounded-xl p-4 flex items-center justify-between gap-4 cursor-pointer hover:border-slate-500 ${task.done ? "done" : ""}`;
        card.onclick = () => toggleTask(task.id);

        card.innerHTML = `
          <div class="flex items-start gap-3.5">
            <input type="checkbox" ${task.done ? "checked" : ""} class="mt-1 w-5 h-5 accent-emerald-500 rounded cursor-pointer pointer-events-none" />
            <div>
              <h3 class="font-bold text-sm md:text-base ${task.done ? "line-through text-slate-400" : "text-slate-100"}">${task.title}</h3>
              <div class="flex flex-wrap items-center gap-2 mt-1.5 text-xs">
                <span class="px-2.5 py-0.5 rounded-md bg-slate-700/80 text-blue-300 font-medium">${task.source}</span>
                <span class="px-2.5 py-0.5 rounded-md bg-slate-700/80 text-amber-300 font-medium">${task.duration}</span>
              </div>
            </div>
          </div>
          <span class="text-xs font-bold px-2.5 py-1 rounded-lg ${task.done ? "bg-emerald-500/20 text-emerald-400" : "bg-slate-700 text-slate-400"}">
            ${task.done ? "Tamamlandı" : "Bekliyor"}
          </span>
        `;
        container.appendChild(card);
      });
    }

    function renderProgress() {
      const total = tasks.length;
      const done = tasks.filter(t => t.done).length;
      const pct = Math.round((done / total) * 100);
      document.getElementById("progressText").textContent = `${done} / ${total} (%${pct})`;
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    function render() {
      renderTabs();
      renderTasks();
      renderProgress();
    }

    async function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.done = !task.done;
      saveLocal();
      render();

      if (SCRIPT_URL && SCRIPT_URL.startsWith("http")) {
        try {
          fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "toggle",
              id: task.id,
              day: task.day,
              title: task.title,
              source: task.source,
              duration: task.duration,
              done: task.done
            })
          });
        } catch (e) {}
      }
    }

    async function pushAllToSheet() {
      const badge = document.getElementById("syncBadge");
      badge.textContent = "⏳ E-Tablo Eşitleniyor...";
      if (SCRIPT_URL && SCRIPT_URL.startsWith("http")) {
        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "syncAll", tasks })
          });
          badge.textContent = "● E-Tablo Eşitlendi";
        } catch (e) {
          badge.textContent = "● Lokal Kayıt Aktif";
        }
      } else {
        badge.textContent = "● Lokal Kayıt Aktif";
      }
    }

    // İlk açılışta çalıştır ve E-Tabloya başlangıç verisini gönder
    render();
    if (!localStorage.getItem(STORAGE_KEY + "_SYNCED")) {
      pushAllToSheet();
      localStorage.setItem(STORAGE_KEY + "_SYNCED", "true");
    }
  </script>
</body>
</html>

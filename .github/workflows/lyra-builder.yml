name: Lyra AI Debug APK
on:
  push:
    branches: [feature/lyra-apk-temporary-build]
  pull_request:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/cmdline-tools"; command -v sdkmanager
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lyra-AI-v0.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
